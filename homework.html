<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>知作 · AI 作业管家</title>
  <style>
    :root{--ink:#202333;--muted:#85899b;--line:#eceef4;--purple:#7667e8;--purple-dark:#6254d6;--lav:#f1efff;--bg:#f6f7fb;--green:#259b72;--amber:#c28228;--red:#d45e68;--shadow:0 16px 50px rgba(37,38,66,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
    .app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-mark{width:37px;height:37px;border-radius:12px;background:linear-gradient(145deg,#978cff,#6758d9);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 6px 15px #7667e844}.brand strong{font-size:16px;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:1px}.nav-label{color:#a2a5b2;font-size:10px;font-weight:700;letter-spacing:1.3px;padding:0 12px;margin:2px 0 8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#777b8c;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-weight:550}.nav button:hover{background:#f8f7ff;color:var(--purple)}.nav button.active{background:var(--lav);color:var(--purple);font-weight:650}.nav .ico{font-size:17px;width:19px;text-align:center}.nav .count{margin-left:auto;color:#999daf;font-size:11px}.side-bottom{margin-top:auto}.tip{background:#f7f6ff;border:1px solid #eeecff;border-radius:14px;padding:15px;color:#77758f;font-size:12px}.tip b{color:#4a456e;display:block;margin-bottom:5px}.tip .spark{color:var(--purple);margin-right:5px}
    .main{min-width:0}.topbar{height:76px;background:#ffffffb8;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(22px,4vw,56px);position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--ink);font-size:14px;margin-left:9px}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:white;border-radius:11px;color:#777b8c;font-size:16px}.avatar{width:36px;height:36px;border-radius:50%;background:#e9e6ff;color:#6254d6;display:grid;place-items:center;font-weight:700;margin-left:4px}.content{max-width:1320px;margin:auto;padding:34px clamp(22px,4vw,56px) 60px}.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:26px}.welcome h1{font-size:25px;margin:0 0 5px;letter-spacing:-.5px}.welcome p{color:var(--muted);margin:0}.primary{border:0;background:var(--purple);color:white;padding:11px 17px;border-radius:10px;font-weight:650;box-shadow:0 5px 13px #7667e833;transition:.15s}.primary:hover{background:var(--purple-dark);transform:translateY(-1px)}.primary .plus{font-size:17px;vertical-align:-1px;margin-right:6px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px 18px;display:flex;align-items:center;gap:14px}.stat-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:18px}.si-purple{background:#f0edff;color:#7465e8}.si-blue{background:#eaf5ff;color:#4b92ce}.si-orange{background:#fff4e8;color:#d89648}.si-green{background:#e9f7f0;color:#299971}.stat-label{font-size:12px;color:var(--muted)}.stat-num{font-size:22px;font-weight:700;line-height:1.2;margin-top:3px}.stat-num span{font-size:12px;font-weight:500;color:var(--muted);margin-left:4px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.panel-head{padding:19px 20px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-head h2{font-size:15px;margin:0}.filters{display:flex;align-items:center;gap:8px}.search{position:relative}.search input{width:190px;padding:9px 11px 9px 34px;border:1px solid var(--line);border-radius:9px;outline:0;background:#fcfcfe}.search input:focus{border-color:#b9b1ff}.search:before{content:'⌕';position:absolute;left:12px;top:5px;color:#999;font-size:20px}.filter-select{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 11px;color:#737789;outline:0}.tabs{display:flex;gap:20px;padding:0 20px;border-bottom:1px solid var(--line)}.tab{border:0;background:none;padding:0 1px 12px;color:#9296a5;font-size:12px;position:relative}.tab.active{color:var(--purple);font-weight:650}.tab.active:after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;border-radius:2px;background:var(--purple)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:690px}.table th{text-align:left;padding:12px 20px;color:#a0a3b0;font-size:10px;font-weight:650;letter-spacing:.5px;background:#fdfdfe}.table td{padding:14px 20px;border-top:1px solid #f1f2f6;color:#666b7c;vertical-align:middle}.table tr:hover td{background:#fdfcff}.work-title{display:flex;align-items:center;gap:11px;color:var(--ink);font-weight:620}.subject-icon{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:#f0edff;font-size:17px}.title-sub{font-size:11px;color:#a1a4b1;font-weight:400;margin-top:2px}.due{color:#5e6374}.due.soon{color:var(--amber)}.due.late{color:var(--red)}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:5px 9px;font-size:10px;font-weight:600;white-space:nowrap}.badge:before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}.b-progress{background:#f1efff;color:#7869dc}.b-todo{background:#fff5e9;color:#bc8335}.b-done{background:#eaf7f0;color:#348d6c}.row-actions{display:flex;gap:6px}.row-actions button{border:0;background:none;color:#a0a3b0;padding:5px;font-size:14px}.row-actions button:hover{color:var(--purple)}.empty{padding:55px 20px;text-align:center;color:#9a9eac}.empty .empty-icon{font-size:31px;margin-bottom:8px}.empty b{display:block;color:#55596b;font-size:14px;margin-bottom:4px}.empty button{margin-top:14px}.footer-note{color:#a1a4b1;font-size:11px;margin-top:14px;text-align:right}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#292a37;color:#fff;padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);transition:.2s;pointer-events:none;z-index:30}.toast.show{transform:translate(-50%,0);opacity:1}
    .modal-backdrop{position:fixed;inset:0;background:#22233366;backdrop-filter:blur(3px);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:17px;box-shadow:0 24px 80px #1b1b302e;padding:24px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f4f4f8;color:#777;width:31px;height:31px;border-radius:9px;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#737789;font-weight:600}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:0;background:#fff;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:#b9b1ff;box-shadow:0 0 0 3px #7667e812}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.secondary{background:white;border:1px solid var(--line);color:#737789;padding:10px 14px;border-radius:9px}.danger{color:var(--red)}
    @media(max-width:850px){.app{grid-template-columns:70px 1fr}.sidebar{padding:20px 10px;align-items:center}.brand{padding:0}.brand strong,.brand small,.nav-label,.nav button .nav-text,.nav .count,.tip{display:none}.nav{width:100%}.nav button{justify-content:center;padding:12px}.nav .ico{font-size:19px}.side-bottom{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:560px){.app{display:block}.sidebar{position:fixed;z-index:10;bottom:0;left:0;right:0;height:62px;padding:6px 12px;border-right:0;border-top:1px solid var(--line);flex-direction:row;justify-content:center}.brand,.side-bottom,.nav-label{display:none}.nav{display:flex;justify-content:space-around;max-width:460px}.nav button{width:52px;height:48px}.main{padding-bottom:62px}.topbar{height:60px;padding:0 17px}.content{padding:24px 16px}.welcome{align-items:flex-start}.welcome h1{font-size:21px}.welcome p{font-size:12px}.welcome .primary{padding:10px 12px;font-size:12px;white-space:nowrap}.stats{gap:9px}.stat{padding:12px 11px;gap:10px}.stat-icon{width:35px;height:35px}.stat-num{font-size:19px}.panel-head{align-items:flex-start;flex-direction:column}.filters{width:100%}.search{flex:1}.search input{width:100%}.filter-select{max-width:130px}.table th,.table td{padding-left:13px;padding-right:13px}.footer-note{text-align:left}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
    /* Quiet palette: one muted indigo accent, thin borders, almost no elevation. */
    :root{--ink:#292d36;--muted:#7a808c;--line:#e7e9ed;--purple:#5e6882;--purple-dark:#4e5872;--lav:#f0f2f6;--bg:#f7f7f8;--shadow:none}
    .brand-mark{background:transparent;box-shadow:none;border:1px solid #d7dbe2;color:var(--purple);border-radius:8px}
    .nav button.active{background:transparent;color:var(--purple)}
    .nav button:hover{background:#f4f5f7;color:var(--purple)}
    .tip{background:#fafafb;border-color:var(--line);border-radius:9px;color:#777d88}.tip b{color:#414754}.tip .spark{color:var(--purple)}
    .avatar{background:#eef0f4;color:var(--purple)}
    .primary{background:var(--purple);box-shadow:none;border-radius:9px}.primary:hover{background:var(--purple-dark);transform:none}
    .stat,.panel{border-radius:9px;box-shadow:none}.stat-icon{background:transparent!important;color:var(--purple)}
    .si-purple,.si-blue,.si-orange,.si-green{background:transparent;color:var(--purple)}
    .search input,.filter-select,.field input,.field select,.field textarea{border-radius:8px}
    .search input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#a9b0c1;box-shadow:none}
    .nav button,.icon-btn,.subject-icon,.close,.secondary,.modal{border-radius:9px}
    .icon-btn{box-shadow:none}.subject-icon{background:transparent!important;color:var(--purple);border:0}
    .tabs .tab.active{color:var(--purple)}.tab.active:after{background:var(--purple)}
    .table tr:hover td{background:#fafafb}.table th{background:#fafafb}.table td{border-top-color:var(--line)}
    .badge,.b-progress,.b-todo,.b-done{background:#f1f2f5;color:#687184}
    .due.soon{color:#9b7947}.due.late{color:#a5676b}
    .row-actions button:hover{color:var(--purple)}
    .modal{box-shadow:none;border:1px solid var(--line)}.close{background:#f2f3f5}.modal-backdrop{backdrop-filter:none;background:#22252c66}.toast{box-shadow:none;border-radius:8px}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">知</div><div><strong>知作</strong><small>AI 作业管家</small></div></div>
    <div style="width:100%"><div class="nav-label">工作空间</div><nav class="nav">
      <button class="active" data-view="all"><span class="ico">▦</span><span class="nav-text">全部作业</span><span class="count" id="navAll">0</span></button>
      <button data-view="todo"><span class="ico">◷</span><span class="nav-text">待开始</span><span class="count" id="navTodo">0</span></button>
      <button data-view="progress"><span class="ico">◌</span><span class="nav-text">进行中</span><span class="count" id="navProgress">0</span></button>
      <button data-view="done"><span class="ico">✓</span><span class="nav-text">已完成</span><span class="count" id="navDone">0</span></button>
    </nav></div>
    <div class="side-bottom"><div class="tip"><b><span class="spark">✦</span>专注你的下一步</b>把任务拆小一点，进度就会一点点累积起来。</div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb">工作空间 <b>/ 作业总览</b></div><div class="top-actions"><button class="icon-btn" id="exportBtn" title="导出备份">⇩</button><button class="icon-btn" id="importBtn" title="导入备份">⇧</button><input type="file" id="importFile" accept="application/json" hidden><div class="avatar">我</div></div></header>
    <section class="content">
      <div class="welcome"><div><h1>你好，今天也来推进一点吧</h1><p id="todayLine">这里是你的 AI 作业空间。</p></div><button class="primary" id="addBtn"><span class="plus">＋</span>添加作业</button></div>
      <div class="stats">
        <div class="stat"><div class="stat-icon si-purple">▤</div><div><div class="stat-label">全部作业</div><div class="stat-num" id="statAll">0<span>项</span></div></div></div>
        <div class="stat"><div class="stat-icon si-blue">◷</div><div><div class="stat-label">进行中</div><div class="stat-num" id="statProgress">0<span>项</span></div></div></div>
        <div class="stat"><div class="stat-icon si-orange">⚑</div><div><div class="stat-label">即将截止</div><div class="stat-num" id="statSoon">0<span>项</span></div></div></div>
        <div class="stat"><div class="stat-icon si-green">✓</div><div><div class="stat-label">已完成</div><div class="stat-num" id="statDone">0<span>项</span></div></div></div>
      </div>
      <section class="panel">
        <div class="panel-head"><h2 id="listTitle">我的作业</h2><div class="filters"><div class="search"><input id="searchInput" type="search" placeholder="搜索作业或课程…" aria-label="搜索作业"></div><select id="sortSelect" class="filter-select" aria-label="排序"><option value="due">按截止日期</option><option value="new">最近添加</option><option value="title">按名称</option></select></div></div>
        <div class="tabs" id="tabs"><button class="tab active" data-status="all">全部</button><button class="tab" data-status="todo">待开始</button><button class="tab" data-status="progress">进行中</button><button class="tab" data-status="done">已完成</button></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>作业名称</th><th>课程 / 主题</th><th>截止日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="homeworkRows"></tbody></table><div class="empty" id="emptyState" hidden><div class="empty-icon">✦</div><b>还没有作业</b><span>添加第一项任务，开始整理你的学习计划。</span><br><button class="primary" id="emptyAdd">＋ 添加作业</button></div></div>
      </section>
      <div class="footer-note">你的作业保存在此浏览器中 · 可随时导出备份</div>
    </section>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">添加作业</h2><button class="close" id="closeModal" aria-label="关闭">×</button></div><form id="homeworkForm"><input id="itemId" type="hidden"><div class="form-grid">
  <div class="field full"><label for="titleInput">作业名称 *</label><input id="titleInput" required maxlength="100" placeholder="例如：神经网络课程项目报告"></div>
  <div class="field"><label for="subjectInput">课程 / 主题</label><input id="subjectInput" maxlength="60" placeholder="例如：机器学习"></div>
  <div class="field"><label for="dueInput">截止日期</label><input id="dueInput" type="date"></div>
  <div class="field"><label for="statusInput">当前状态</label><select id="statusInput"><option value="todo">待开始</option><option value="progress">进行中</option><option value="done">已完成</option></select></div>
  <div class="field"><label for="linkInput">资料链接（选填）</label><input id="linkInput" type="url" placeholder="https://..."></div>
  <div class="field full"><label for="notesInput">作业要求 / 备注</label><textarea id="notesInput" maxlength="3000" placeholder="记录题目要求、思路、提交说明……"></textarea></div>
  </div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">取消</button><button class="primary" type="submit">保存作业</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
  const KEY='zhizuo-homework-v1';
  let items=[]; let view='all'; let tab='all'; let search=''; let sort='due'; let toastTimer;
  const $=id=>document.getElementById(id);
  const labels={todo:'待开始',progress:'进行中',done:'已完成'};
  const colors=['#f0edff','#eaf5ff','#fff3e7','#e9f7f0','#fff0f2'];
  const icons=['✦','⌘','◈','▧','✧'];
  function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');items=Array.isArray(v)?v:[]}catch{items=[]}}
  function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}
  function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function dateText(value){if(!value)return '未设置';const d=new Date(value+'T00:00:00');return new Intl.DateTimeFormat('zh-CN',{month:'short',day:'numeric'}).format(d)}
  function daysLeft(value){if(!value)return null;return Math.ceil((new Date(value+'T00:00:00')-new Date(new Date().toDateString()))/86400000)}
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2100)}
  function render(){
    const all=items.length,done=items.filter(x=>x.status==='done').length,progress=items.filter(x=>x.status==='progress').length,today=new Date().toISOString().slice(0,10);
    const soon=items.filter(x=>x.status!=='done'&&x.due&&daysLeft(x.due)>=0&&daysLeft(x.due)<=7).length;
    $('statAll').innerHTML=`${all}<span>项</span>`;$('statProgress').innerHTML=`${progress}<span>项</span>`;$('statSoon').innerHTML=`${soon}<span>项</span>`;$('statDone').innerHTML=`${done}<span>项</span>`;
    $('navAll').textContent=all;$('navTodo').textContent=items.filter(x=>x.status==='todo').length;$('navProgress').textContent=progress;$('navDone').textContent=done;
    $('todayLine').textContent=`${new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date())} · 慢慢来，完成每一步。`;
    const filtered=items.filter(x=>(view==='all'||x.status===view)&&(tab==='all'||x.status===tab)&&(!search||`${x.title} ${x.subject} ${x.notes}`.toLowerCase().includes(search.toLowerCase())));
    filtered.sort((a,b)=>sort==='new'?(b.created||0)-(a.created||0):sort==='title'?a.title.localeCompare(b.title,'zh-CN'):(a.due||'9999').localeCompare(b.due||'9999'));
    const tbody=$('homeworkRows');tbody.innerHTML=filtered.map((x,i)=>{const d=daysLeft(x.due);const dueClass=d!==null&&d<0&&x.status!=='done'?'late':d!==null&&d<=3&&x.status!=='done'?'soon':'';const dueLabel=d===null?'':d<0&&x.status!=='done'?' · 已逾期':d===0?' · 今天截止':d>0&&d<=3?` · ${d}天后`:'';const ix=Math.abs(hash(x.id||x.title))%icons.length;return `<tr><td><div class="work-title"><div class="subject-icon" style="background:${colors[ix]}">${icons[ix]}</div><div><div>${esc(x.title)}</div><div class="title-sub">${x.notes?esc(x.notes.slice(0,38))+(x.notes.length>38?'…':''):'点击编辑补充作业要求'}</div></div></div></td><td>${esc(x.subject||'未分类')}</td><td><span class="due ${dueClass}">${dateText(x.due)}${dueLabel}</span></td><td><span class="badge b-${x.status}">${labels[x.status]||labels.todo}</span></td><td><div class="row-actions"><button title="编辑" data-action="edit" data-id="${esc(x.id)}">✎</button><button title="删除" data-action="delete" data-id="${esc(x.id)}">⌫</button></div></td></tr>`}).join('');
    $('emptyState').hidden=filtered.length>0;tbody.parentElement.querySelector('thead').style.display=filtered.length?'':'none';
  }
  function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h}
  function openModal(item){$('homeworkForm').reset();$('itemId').value=item?.id||'';$('modalTitle').textContent=item?'编辑作业':'添加作业';$('titleInput').value=item?.title||'';$('subjectInput').value=item?.subject||'';$('dueInput').value=item?.due||'';$('statusInput').value=item?.status||'todo';$('linkInput').value=item?.link||'';$('notesInput').value=item?.notes||'';$('modalBackdrop').classList.add('open');setTimeout(()=>$('titleInput').focus(),30)}
  function closeModal(){$('modalBackdrop').classList.remove('open')}
  document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;tab='all';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.status==='all'));$('listTitle').textContent=({all:'我的作业',todo:'待开始',progress:'进行中',done:'已完成'})[view];render()}));
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.status;view='all';document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view==='all'));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()}));
  $('addBtn').onclick=()=>openModal();$('emptyAdd').onclick=()=>openModal();$('closeModal').onclick=closeModal;$('cancelModal').onclick=closeModal;$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
  $('searchInput').addEventListener('input',e=>{search=e.target.value;render()});$('sortSelect').addEventListener('change',e=>{sort=e.target.value;render()});
  $('homeworkRows').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const item=items.find(x=>x.id===b.dataset.id);if(!item)return;if(b.dataset.action==='edit')openModal(item);else if(confirm(`确定删除“${item.title}”吗？`)){items=items.filter(x=>x.id!==item.id);save();toast('作业已删除')}});
  $('homeworkForm').addEventListener('submit',e=>{e.preventDefault();const id=$('itemId').value;const prior=items.find(x=>x.id===id);const item={id:id||crypto.randomUUID(),title:$('titleInput').value.trim(),subject:$('subjectInput').value.trim(),due:$('dueInput').value,status:$('statusInput').value,link:$('linkInput').value.trim(),notes:$('notesInput').value.trim(),created:prior?.created||Date.now(),updated:Date.now()};if(!item.title)return;if(prior)items=items.map(x=>x.id===id?item:x);else items.unshift(item);save();closeModal();toast(prior?'作业已更新':'作业已添加')});
  $('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'知作作业管家',version:1,exportedAt:new Date().toISOString(),items},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`知作作业备份-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('备份文件已导出')};
  $('importBtn').onclick=()=>$('importFile').click();$('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());const incoming=Array.isArray(data)?data:data.items;if(!Array.isArray(incoming))throw Error();if(confirm(`将导入 ${incoming.length} 项作业并替换当前列表，是否继续？`)){items=incoming.filter(x=>x&&x.title).map(x=>({...x,id:x.id||crypto.randomUUID(),status:labels[x.status]?x.status:'todo'}));save();toast('作业备份已导入')}}catch{toast('文件格式不正确，无法导入')}e.target.value=''});
  load();render();
})();
</script>
</body>
</html>
