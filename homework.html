<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f8">
<title>知作 · AI 作业与笔记</title>
<style>
:root{--ink:#292d36;--muted:#7a808c;--soft:#a0a5af;--line:#e7e9ed;--accent:#5e6882;--accent-hover:#4e5872;--accent-bg:#f0f2f6;--bg:#f7f7f8;--white:#fff;--green:#748976;--amber:#9b7947;--font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-family)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:230px minmax(0,1fr)}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:21px 15px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 25px;font-size:14px;font-weight:700}.brand-mark{width:32px;height:32px;border:1px solid #d7dbe2;border-radius:8px;display:grid;place-items:center;color:var(--accent)}.brand small{display:block;margin-top:1px;color:var(--muted);font-weight:400;font-size:10px}.nav-caption{padding:8px 10px;color:#a0a5af;font:10px ui-monospace,monospace;letter-spacing:.12em}.nav-parent{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:10px;border:0;background:transparent;border-radius:8px;color:#59606c;font-size:12px;font-weight:650}.nav-parent:hover{background:#f7f8f9}.parent-glyph{width:16px;text-align:center;color:var(--accent)}.chevron{margin-left:auto;color:#8b919c;transition:transform .16s}.nav-parent[aria-expanded="false"] .chevron{transform:rotate(-90deg)}.children{display:grid;gap:2px;overflow:hidden;max-height:120px;transition:max-height .2s ease}.children.collapsed{max-height:0}.child{margin-left:25px;width:calc(100% - 25px);display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;border:0;background:transparent;border-radius:7px;color:#737a86;font-size:11px}.child:hover{background:#f6f7f8}.child.active{background:#eef0f4;color:var(--accent);font-weight:650}.child-dot{width:5px;height:5px;border:1px solid #a9afba;border-radius:50%}.child.active .child-dot{background:var(--accent);border-color:var(--accent)}.sidebar-rule{height:1px;background:var(--line);margin:15px 5px}.nav-muted{width:100%;padding:9px 10px;color:#a0a5af;font-size:11px;display:flex;gap:10px;align-items:center;border:0;background:transparent;text-align:left;border-radius:7px;cursor:pointer}.nav-muted:hover{background:#f4f5f7;color:var(--accent)}.nav-muted i{width:16px;text-align:center;font-style:normal}.side-note{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 2px;font-size:10px;color:#9298a2;line-height:1.7}.side-note b{display:block;color:#555c68;font-size:10px;font-weight:600}
.main{min-width:0}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,48px);background:#ffffffc9;border-bottom:1px solid var(--line)}.crumb{font-size:11px;color:var(--muted)}.crumb b{font-size:12px;color:var(--ink);margin-left:7px}.top-right{display:flex;align-items:center;gap:9px}.settings-button{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#737a86;font-size:10px}.settings-button:hover{border-color:#cbd0d8;color:var(--accent)}.preview-chip{font-size:9px;color:var(--accent);background:#f0f2f5;border-radius:5px;padding:5px 7px}.avatar{width:29px;height:29px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:10px;color:#737a86}.content{width:min(1160px,100%);margin:auto;padding:28px clamp(18px,4vw,48px) 48px}.preview-note{display:flex;gap:8px;align-items:center;padding:8px 11px;background:#fbfbfc;border:1px solid var(--line);border-radius:8px;color:#818792;font-size:10px;margin-bottom:20px}.preview-note i{width:6px;height:6px;border-radius:50%;background:var(--accent)}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin-bottom:21px}.page-head h1{font-size:23px;letter-spacing:-.04em;margin:0 0 4px}.page-head p{font-size:11px;color:var(--muted);margin:0}.actions{display:flex;gap:7px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 11px;background:#fff;border:1px solid var(--line);border-radius:8px;color:#656c79;font-size:10px}.btn:hover{border-color:#cbd0d8;color:var(--accent)}.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#fff}.btn .sym{font-size:14px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:13px 15px;display:flex;align-items:center;gap:11px}.stat-mark{width:24px;text-align:center;color:var(--accent);font-size:15px}.stat label{display:block;font-size:9px;color:var(--muted)}.stat strong{font:600 17px ui-monospace,monospace;display:block;margin-top:1px}.panel{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px 12px}.panel-head h2{font-size:13px;margin:0}.toolbar{display:flex;align-items:center;gap:7px}.tabs{display:flex;align-items:center;gap:15px;padding:0 16px;border-bottom:1px solid var(--line)}.tab{position:relative;border:0;background:transparent;padding:0 1px 10px;color:#9298a2;font-size:10px}.tab.active{color:var(--accent);font-weight:650}.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}.search{position:relative}.search:before{content:"⌕";position:absolute;left:9px;top:2px;font-size:17px;color:#999fab}.search input{width:160px;padding:7px 8px 7px 26px;border:1px solid var(--line);border-radius:7px;outline:0;font-size:10px;background:#fff}.search input:focus{border-color:#afb6c5}.select{padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#747b86;font-size:10px;outline:0}
.task-list{padding:1px 15px 8px}.task{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 120px 95px 75px 100px;align-items:center;gap:9px;padding:13px 4px;border:0;border-top:1px solid #f0f1f3;background:#fff;text-align:left;color:inherit;cursor:pointer}.task:hover{background:#fbfbfc}.task-name{font-size:11px;font-weight:620;color:#343944}.task-sub{font-size:9px;color:#9ba1ab;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-course,.task-due{font-size:9px;color:#747b86}.status{justify-self:start;border-radius:5px;padding:4px 7px;background:#f1f2f4;color:#717987;font-size:9px}.status.done{background:#f1f3f1;color:#697969}.status.progress{background:#f0f2f6;color:var(--accent)}.row-actions{display:flex;align-items:center;justify-content:flex-end;gap:4px}.edit-action{border:1px solid transparent;background:transparent;color:#7c8491;padding:4px 6px;border-radius:5px;font-size:9px}.edit-action:hover{border-color:var(--line);background:#f7f8f9;color:var(--accent)}.delete-action{color:#9a7474}.delete-action:hover{border-color:#e7d9d9;background:#faf6f6;color:#8f5e5e}.row-arrow{color:#a1a6af;font-size:14px}.empty-list{text-align:center;padding:45px 15px;color:#9298a2;font-size:10px}.empty-list b{display:block;color:#555c68;margin:7px 0 3px;font-size:12px}
.modulebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}.module{padding:6px 9px;border:1px solid transparent;background:transparent;border-radius:6px;color:#7a818d;font-size:9px}.module.active{background:#eceef2;color:var(--accent);font-weight:650}.module.add{border-color:var(--line);background:#fff;color:var(--accent)}.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));align-items:start;gap:10px}.note-card{position:relative;min-height:150px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:34px 14px 14px;transition:border-color .12s;color:inherit;cursor:pointer}.note-card:hover{border-color:#cbd0d8}.note-card-actions{position:absolute;top:7px;right:9px}.note-card-actions .edit-action{padding:3px 6px;border-color:#e4e6ea;background:#fff}.note-meta{display:flex;justify-content:space-between;gap:8px;margin-bottom:9px}.note-module{font-size:9px;color:var(--accent);background:#f4f5f7;padding:3px 6px;border-radius:5px}.note-date{font-size:9px;color:#a0a5af}.note-card h3{margin:0 0 7px;font-size:12px;letter-spacing:-.02em}.note-excerpt{font-size:10px;color:#777e89;line-height:1.75;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.note-bottom{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:12px;padding-top:9px;border-top:1px solid #f0f1f3;color:#969ca6;font-size:9px}.note-tags{color:#858c98}.detail-link{margin-top:12px}.detail-link a{display:inline-flex;padding:7px 10px;border:1px solid var(--line);border-radius:6px;color:var(--accent);font-size:10px;text-decoration:none}.detail-link a:hover{background:#f7f8fa}.detail-hint{text-align:right;color:#a0a5af;font-size:9px;margin-top:9px}
.modal-backdrop{position:fixed;inset:0;background:#24283266;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-backdrop.open{display:flex}.modal{width:min(620px,100%);max-height:min(88vh,780px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:20px}.modal-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:13px}.modal-title-wrap{min-width:0}.modal-kicker{font:9px ui-monospace,monospace;letter-spacing:.1em;color:var(--accent);margin-bottom:5px}.modal h2{margin:0;font-size:18px;letter-spacing:-.03em}.close{border:0;background:transparent;color:#858b95;font-size:20px;padding:0 5px;border-radius:5px}.close:hover{background:#f1f2f5}.detail-info{display:flex;flex-wrap:wrap;gap:7px;padding-bottom:12px;border-bottom:1px solid var(--line);font-size:9px;color:#838a95}.detail-pill{border:1px solid var(--line);border-radius:5px;padding:4px 7px}.detail-content{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.9;color:#555c68;padding:15px 2px 6px;min-height:110px}.detail-foot{border-top:1px solid var(--line);padding-top:11px;margin-top:12px;display:flex;justify-content:space-between;color:#969ca6;font-size:9px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#727985}.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-size:10px;outline:0}.field textarea{resize:vertical;min-height:160px;line-height:1.8}.field input:focus,.field select:focus,.field textarea:focus{border-color:#afb6c5}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}.settings-modal{width:min(460px,100%)}.settings-form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.settings-note{margin:13px 0 0;padding:10px;border:1px solid var(--line);border-radius:7px;background:#fafafb;color:#828894;font-size:10px;line-height:1.7}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#353a44;color:#fff;padding:8px 12px;border-radius:7px;font-size:10px;transition:.15s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.app{grid-template-columns:70px minmax(0,1fr)}.sidebar{padding:18px 8px;align-items:center}.brand{padding:0 0 22px}.brand-text,.nav-caption,.parent-text,.children .child-text,.nav-muted,.side-note{display:none}.nav-muted{display:flex!important;justify-content:center;padding:9px 0}.nav-muted span{display:none}.nav-parent{justify-content:center;padding:10px 4px}.chevron{display:none}.children{max-height:150px}.child{width:100%;margin:0;justify-content:center;padding:10px 4px}.task{grid-template-columns:minmax(0,1fr) 100px 76px 94px}.task-course{display:none}}
@media(max-width:560px){.app{display:block}.sidebar{position:fixed;bottom:0;left:0;right:0;height:59px;z-index:5;padding:5px 10px;border:0;border-top:1px solid var(--line);flex-direction:row;justify-content:center}.brand,.nav-caption,.side-note{display:none}.nav-parent{display:none}.children{display:flex!important;max-height:none!important;justify-content:space-around;width:min(380px,calc(100% - 50px))}.sidebar-rule{display:none}.nav-muted{display:flex!important;position:fixed;right:10px;bottom:7px;width:43px;height:44px;justify-content:center;padding:0;border:1px solid var(--line);background:#fff;z-index:12}.nav-muted span{display:none}.child{width:52px;height:47px}.child-text{display:block!important;font-size:9px}.child-dot{display:none}.main{padding-bottom:59px}.topbar{height:57px;padding:0 14px}.content{padding:18px 13px 30px}.preview-note{font-size:9px}.page-head{align-items:flex-start;display:block}.page-head h1{font-size:21px}.page-head p{font-size:10px}.actions{margin-top:12px}.stats{grid-template-columns:repeat(2,1fr);gap:7px}.stat{padding:10px}.stat strong{font-size:15px}.panel-head{display:block;padding:12px}.toolbar{margin-top:10px}.search{flex:1}.search input{width:100%}.tabs{gap:12px}.task-list{padding:1px 10px 8px}.task{grid-template-columns:minmax(0,1fr) 57px 88px;gap:5px;padding:12px 2px}.task-due,.task-course{display:none}.task-name{font-size:10px}.edit-action{font-size:8px;padding:4px}.notes-grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:16px}.settings-form{grid-template-columns:1fr}.detail-content{font-size:11px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">知</span><span class="brand-text">知作<small>AI 作业管家</small></span></div>
    <div class="nav-caption">学习空间</div>
    <button class="nav-parent" id="parentToggle" aria-expanded="true"><span class="parent-glyph">▦</span><span class="parent-text">学习空间</span><span class="chevron">⌄</span></button>
    <nav class="children" id="children" aria-label="学习空间分支">
      <button class="child active" data-view="homework"><span class="child-dot"></span><span class="child-text">作业区</span></button>
      <button class="child" data-view="notes"><span class="child-dot"></span><span class="child-text">笔记区</span></button>
    </nav>
    <div class="sidebar-rule"></div><button class="nav-muted" id="settingsOpen" type="button"><i>⚙</i><span>偏好设置</span></button>
    <div class="side-note"><b>本机保存</b>作业与笔记保存在当前浏览器中。</div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb">学习空间 <b>/ <span id="crumbName">作业区</span></b></div><div class="top-right"><button class="btn backup-btn" id="exportWorkspace" type="button">导出备份</button><button class="btn backup-btn" id="importWorkspace" type="button">导入备份</button><input id="workspaceFile" type="file" accept="application/json" hidden><span class="avatar">我</span></div></header>
    <section class="content">
      <div id="homeworkView">
        <div class="page-head"><div><h1>作业区</h1><p>查看任务进度，点开已完成作业可直接查看题目与记录。</p></div><div class="actions"><button class="btn btn-primary" id="newTask"><span class="sym">＋</span>添加作业</button></div></div>
        <div class="stats"><div class="stat"><span class="stat-mark">▤</span><div><label>全部作业</label><strong id="taskAll">4</strong></div></div><div class="stat"><span class="stat-mark">◷</span><div><label>进行中</label><strong id="taskProgress">2</strong></div></div><div class="stat"><span class="stat-mark">⚑</span><div><label>即将截止</label><strong id="taskSoon">1</strong></div></div><div class="stat"><span class="stat-mark">✓</span><div><label>已完成</label><strong id="taskDone">2</strong></div></div></div>
        <section class="panel"><div class="panel-head"><h2>我的作业</h2><div class="toolbar"><div class="search"><input id="taskSearch" type="search" placeholder="搜索作业…" aria-label="搜索作业"></div><select class="select" id="taskSort"><option value="due">按截止日期</option><option value="title">按名称</option></select></div></div><div class="tabs" id="taskTabs"><button class="tab active" data-filter="all">全部</button><button class="tab" data-filter="progress">进行中</button><button class="tab" data-filter="done">已完成</button></div><div class="task-list" id="taskList"></div></section>
      </div>
      <div id="notesView" hidden>
        <div class="page-head"><div><h1>笔记区</h1><p>按模块整理课程、灵感与复习内容。点击笔记卡片直接展开全文。</p></div><div class="actions"><button class="btn" id="importNotes"><span class="sym">↑</span>导入笔记</button><button class="btn btn-primary" id="newNote"><span class="sym">＋</span>新建笔记</button><input id="fileInput" type="file" accept=".md,.markdown,.txt,.json,text/plain,text/markdown,application/json" multiple hidden></div></div>
        <div class="stats"><div class="stat"><span class="stat-mark">≡</span><div><label>全部笔记</label><strong id="noteTotal">3</strong></div></div><div class="stat"><span class="stat-mark">▦</span><div><label>模块</label><strong id="noteModules">3</strong></div></div><div class="stat"><span class="stat-mark">↻</span><div><label>最近更新</label><strong style="font:600 12px/1.6 inherit">今天</strong></div></div><div class="stat"><span class="stat-mark">⌕</span><div><label>查找内容</label><strong style="font:600 12px/1.6 inherit">即时搜索</strong></div></div></div>
        <div class="modulebar" id="modulebar"></div><section class="panel"><div class="panel-head"><h2 id="noteSectionTitle">全部笔记</h2><div class="toolbar"><div class="search"><input id="noteSearch" type="search" placeholder="搜索笔记…" aria-label="搜索笔记"></div><select class="select" id="noteSort"><option value="updated">最近更新</option><option value="title">按标题</option></select></div></div><div class="notes-grid" id="noteGrid" style="padding:0 12px 14px"></div></section><div class="detail-hint">自动排版 · 卡片随屏幕宽度自适应</div>
      </div>
    </section>
  </main>
</div>
<div class="modal-backdrop" id="detailBackdrop" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><article class="modal"><div class="modal-header"><div class="modal-title-wrap"><div class="modal-kicker" id="detailKicker">内容详情</div><h2 id="detailTitle"></h2></div><button class="close" data-close="detail" aria-label="关闭">×</button></div><div class="detail-info" id="detailInfo"></div><div class="detail-content" id="detailContent"></div><div id="detailLink" class="detail-link" hidden></div><div class="detail-foot"><span id="detailFootLeft"></span><span id="detailFootRight">点击空白处或 Esc 关闭</span></div></article></div>
<div class="modal-backdrop" id="editBackdrop" role="dialog" aria-modal="true" aria-labelledby="editTitle"><article class="modal"><div class="modal-header"><div class="modal-title-wrap"><div class="modal-kicker">笔记区</div><h2 id="editTitle">新建笔记</h2></div><button class="close" data-close="edit" aria-label="关闭">×</button></div><form id="noteForm"><input id="editId" type="hidden"><div class="form"><div class="field full"><label for="noteTitle">标题</label><input id="noteTitle" required placeholder="给笔记起个标题"></div><div class="field"><label for="noteModule">模块</label><select id="noteModule"></select></div><div class="field"><label for="noteTags">标签（逗号分隔）</label><input id="noteTags" placeholder="例如：重点，期末复习"></div><div class="field full"><label for="noteBody">笔记内容</label><textarea id="noteBody" placeholder="记录课程内容、想法或复习要点"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" data-close="edit">取消</button><button type="submit" class="btn btn-primary">保存笔记</button></div></form></article></div>
<div class="modal-backdrop" id="taskBackdrop" role="dialog" aria-modal="true" aria-labelledby="taskEditTitle"><article class="modal"><div class="modal-header"><div class="modal-title-wrap"><div class="modal-kicker">作业区</div><h2 id="taskEditTitle">新建作业</h2></div><button class="close" data-close="task" aria-label="关闭">×</button></div><form id="taskForm"><input id="taskEditId" type="hidden"><div class="form"><div class="field full"><label for="taskTitle">作业名称</label><input id="taskTitle" required placeholder="例如：机器学习课程报告"></div><div class="field"><label for="taskCourse">课程 / 主题</label><input id="taskCourse" placeholder="例如：机器学习"></div><div class="field"><label for="taskDue">截止日期</label><input id="taskDue" type="date"></div><div class="field"><label for="taskStatus">状态</label><select id="taskStatus"><option value="progress">进行中</option><option value="done">已完成</option></select></div><div class="field full"><label for="taskLink">作业链接（可选）</label><input id="taskLink" type="url" placeholder="https://…"></div><div class="field full"><label for="taskContent">作业内容 / 完成记录</label><textarea id="taskContent" placeholder="粘贴题目要求、记录作答或完成心得"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" data-close="task">取消</button><button class="btn btn-primary" type="submit">保存作业</button></div></form></article></div>
<div class="modal-backdrop" id="settingsBackdrop" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><article class="modal settings-modal"><div class="modal-header"><div class="modal-title-wrap"><div class="modal-kicker">偏好设置</div><h2 id="settingsTitle">设置</h2></div><button class="close" data-close="settings" aria-label="关闭">×</button></div><div class="settings-form"><div class="field"><label for="settingLanguage">语言偏好</label><select id="settingLanguage"><option value="zh-CN">简体中文</option><option value="en">English（语言偏好）</option></select></div><div class="field"><label for="settingFont">字体</label><select id="settingFont"><option value="system">系统默认</option><option value="serif">衬线字体</option><option value="mono">等宽字体</option></select></div><div class="field full"><label for="settingStorage">存储盘 / 位置</label><select id="settingStorage"><option value="browser">此浏览器 · 本机存储</option><option value="device">电脑文件夹 · 未连接</option><option value="onedrive">OneDrive · 未连接</option><option value="gdrive">Google Drive · 未连接</option></select></div></div><p class="settings-note">语言偏好会保存，但当前界面仅提供简体中文。笔记和作业实际保存在当前浏览器；电脑文件夹与云盘尚未连接，选择后不会迁移数据。</p><div class="modal-actions"><button class="btn" type="button" data-close="settings">取消</button><button class="btn btn-primary" type="button" id="saveSettings">保存设置</button></div></article></div>
<div class="toast" id="toast"></div>
<script>
(()=>{
  const KEY='zhizuo-workspace-preview-v1',SETTINGS_KEY='zhizuo-workspace-preview-settings-v1',DEFAULT_MODULES=['课程笔记','AI 灵感','复习清单'];
  let tasks=[];
  let modules=[...DEFAULT_MODULES],notes=[];
  let view='homework',taskFilter='all',noteModule='全部笔记',taskSearch='',noteSearch='',taskSort='due',noteSort='updated',toastTimer,settings={language:'zh-CN',font:'system',storage:'browser'};
  const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function safeHref(raw){try{const u=new URL(raw);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}
  function applyFont(){const families={system:'Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif',serif:'Georgia,"Noto Serif SC","Songti SC",serif',mono:'"SFMono-Regular",Consolas,"Liberation Mono","Microsoft YaHei",monospace'};document.documentElement.style.setProperty('--font-family',families[settings.font]||families.system)}
  function loadSettings(){try{settings={...settings,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch{}$('settingLanguage').value=settings.language;$('settingFont').value=settings.font;$('settingStorage').value=settings.storage;document.documentElement.lang='zh-CN';applyFont()}
  function toast(s){const x=$('toast');x.textContent=s;x.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),1800)}
  function persist(){localStorage.setItem(KEY,JSON.stringify({tasks,notes,modules}))}
  function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x){if(Array.isArray(x.tasks))tasks=x.tasks;if(Array.isArray(x.notes))notes=x.notes;if(Array.isArray(x.modules)&&x.modules.length)modules=x.modules;return}const legacy=JSON.parse(localStorage.getItem('zhizuo-homework-v1')||'null');if(Array.isArray(legacy)){tasks=legacy.map(item=>({id:item.id||crypto.randomUUID(),title:item.title||'未命名作业',course:item.course||item.subject||'',due:item.due||'',status:item.status==='done'?'done':'progress',link:item.link||'',content:item.content||item.notes||''}));persist()}}catch{}}
  function date(s){if(!s)return'未设置';return new Intl.DateTimeFormat('zh-CN',{month:'short',day:'numeric'}).format(new Date(s+'T00:00:00'))}
  function setView(next){view=next;taskFilter='all';noteModule='全部笔记';$('homeworkView').hidden=next!=='homework';$('notesView').hidden=next!=='notes';$('crumbName').textContent=next==='homework'?'作业区':'笔记区';document.querySelectorAll('.child').forEach(b=>b.classList.toggle('active',b.dataset.view===next));renderTasks();renderNotes()}
  function renderTasks(){const done=tasks.filter(t=>t.status==='done').length,progress=tasks.filter(t=>t.status==='progress').length;$('taskAll').textContent=tasks.length;$('taskDone').textContent=done;$('taskProgress').textContent=progress;$('taskSoon').textContent=tasks.filter(t=>t.status!=='done'&&t.due).length;
    let list=tasks.filter(t=>(taskFilter==='all'||t.status===taskFilter)&&(!taskSearch||`${t.title} ${t.course} ${t.content}`.toLowerCase().includes(taskSearch.toLowerCase())));list.sort((a,b)=>taskSort==='title'?a.title.localeCompare(b.title,'zh-CN'):(a.due||'9999').localeCompare(b.due||'9999'));
    $('taskList').innerHTML=list.length?list.map(t=>`<div class="task" data-task="${esc(t.id)}" role="button" tabindex="0" aria-label="打开作业：${esc(t.title)}"><span><span class="task-name">${esc(t.title)}</span><span class="task-sub">${esc(t.content.split('\n')[0])}</span></span><span class="task-course">${esc(t.course||'未分类')}</span><span class="task-due">${date(t.due)}</span><span class="status ${t.status}">${t.status==='done'?'已完成':'进行中'}</span><span class="row-actions"><button class="edit-action" type="button" data-edit-task="${esc(t.id)}">编辑</button><button class="edit-action delete-action" type="button" data-delete-task="${esc(t.id)}">删除</button><span class="row-arrow">›</span></span></div>`).join(''):'<div class="empty-list">没有匹配的作业</div>';
    document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===taskFilter));
  }
  function renderModules(){const counts=Object.fromEntries(modules.map(m=>[m,notes.filter(n=>n.module===m).length]));$('modulebar').innerHTML=`<button class="module ${noteModule==='全部笔记'?'active':''}" data-module="全部笔记">全部笔记 · ${notes.length}</button>`+modules.map(m=>`<button class="module ${noteModule===m?'active':''}" data-module="${esc(m)}">${esc(m)} · ${counts[m]||0}</button>`).join('')+`<button class="module add" id="addModule">＋ 新建模块</button>`;$('noteModule').innerHTML=modules.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('');$('noteTotal').textContent=notes.length;$('noteModules').textContent=modules.length;$('noteSectionTitle').textContent=noteModule}
  function renderNotes(){renderModules();let list=notes.filter(n=>(noteModule==='全部笔记'||n.module===noteModule)&&(!noteSearch||`${n.title} ${n.body} ${n.module} ${(n.tags||[]).join(' ')}`.toLowerCase().includes(noteSearch.toLowerCase())));list.sort((a,b)=>noteSort==='title'?a.title.localeCompare(b.title,'zh-CN'):(b.updated||0)-(a.updated||0));$('noteGrid').innerHTML=list.length?list.map(n=>`<article class="note-card" data-note="${esc(n.id)}" tabindex="0" role="button" aria-label="打开笔记：${esc(n.title)}"><div class="note-card-actions"><button class="edit-action" type="button" data-edit-note="${esc(n.id)}">编辑</button><button class="edit-action delete-action" type="button" data-delete-note="${esc(n.id)}">删除</button></div><span class="note-meta"><span class="note-module">${esc(n.module)}</span><span class="note-date">${date(new Date(n.updated||Date.now()).toISOString().slice(0,10))}</span></span><h3>${esc(n.title)}</h3><span class="note-excerpt">${esc(n.body)}</span><span class="note-bottom"><span>${n.body.length} 字</span><span class="note-tags">${(n.tags||[]).map(esc).join(' · ')}</span><span>打开 ›</span></span></article>`).join(''):'<div class="empty-list" style="grid-column:1/-1">这个模块还没有笔记。可以新建或导入笔记。</div>'}
  function openDetail(kind,item){$('detailKicker').textContent=kind==='task'?(item.status==='done'?'已完成作业 · 完整内容':'作业内容 · 完整详情'):`笔记 · ${item.module}`;$('detailTitle').textContent=item.title;$('detailInfo').innerHTML=kind==='task'?`<span class="detail-pill">${esc(item.course||'未分类')}</span><span class="detail-pill">${item.status==='done'?'已完成':'进行中'}</span><span class="detail-pill">截止 ${date(item.due)}</span>`:`<span class="detail-pill">${esc(item.module)}</span>${(item.tags||[]).map(t=>`<span class="detail-pill">${esc(t)}</span>`).join('')}<span class="detail-pill">${new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'numeric',day:'numeric'}).format(new Date(item.updated||Date.now()))}</span>`;$('detailContent').textContent=item.content??item.body??'暂无内容';const link=safeHref(item.link||'');$('detailLink').hidden=!(kind==='task'&&link);$('detailLink').innerHTML=kind==='task'&&link?`<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">打开作业链接 ↗</a>`:'';$('detailFootLeft').textContent=kind==='task'?`${(item.content||'').length} 字 · 作业内容`:`${(item.body||'').length} 字 · 笔记全文`;$('detailBackdrop').classList.add('open')}
  function close(id){$(id).classList.remove('open')}
  function openNoteEditor(n){$('noteForm').reset();$('editId').value=n?.id||'';$('editTitle').textContent=n?'编辑笔记':'新建笔记';$('noteTitle').value=n?.title||'';$('noteModule').value=n?.module||modules[0];$('noteTags').value=n?.tags?.join('，')||'';$('noteBody').value=n?.body||'';$('editBackdrop').classList.add('open')}
  function openTaskEditor(t){$('taskForm').reset();$('taskEditId').value=t?.id||'';$('taskEditTitle').textContent=t?'编辑作业':'新建作业';$('taskTitle').value=t?.title||'';$('taskCourse').value=t?.course||'';$('taskDue').value=t?.due||'';$('taskStatus').value=t?.status||'progress';$('taskLink').value=t?.link||'';$('taskContent').value=t?.content||'';$('taskBackdrop').classList.add('open')}
  $('parentToggle').addEventListener('click',()=>{const open=$('parentToggle').getAttribute('aria-expanded')==='true';$('parentToggle').setAttribute('aria-expanded',String(!open));$('children').classList.toggle('collapsed',open)});
  document.querySelectorAll('.child').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
  $('taskTabs').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;taskFilter=b.dataset.filter;renderTasks()});$('taskSearch').addEventListener('input',e=>{taskSearch=e.target.value;renderTasks()});$('taskSort').addEventListener('change',e=>{taskSort=e.target.value;renderTasks()});$('taskList').addEventListener('click',e=>{const del=e.target.closest('[data-delete-task]');if(del){e.stopPropagation();const t=tasks.find(x=>x.id===del.dataset.deleteTask);if(t&&confirm(`确定删除作业「${t.title}」吗？`)){tasks=tasks.filter(x=>x.id!==t.id);persist();renderTasks();toast('作业已删除')}return}const edit=e.target.closest('[data-edit-task]');if(edit){e.stopPropagation();const t=tasks.find(x=>x.id===edit.dataset.editTask);if(t)openTaskEditor(t);return}const row=e.target.closest('[data-task]');if(row){const item=tasks.find(t=>t.id===row.dataset.task);if(item)openDetail('task',item)}});$('taskList').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-task]')){e.preventDefault();const t=tasks.find(x=>x.id===e.target.dataset.task);if(t)openDetail('task',t)}});
  $('modulebar').addEventListener('click',e=>{const b=e.target.closest('[data-module]');if(b){noteModule=b.dataset.module;renderNotes();return}if(e.target.closest('#addModule')){const name=prompt('输入模块名称');if(!name)return;const m=name.trim().slice(0,24);if(m&&!modules.includes(m)){modules.push(m);noteModule=m;persist();renderNotes()}else if(modules.includes(m))toast('该模块已存在')}});$('noteSearch').addEventListener('input',e=>{noteSearch=e.target.value;renderNotes()});$('noteSort').addEventListener('change',e=>{noteSort=e.target.value;renderNotes()});$('noteGrid').addEventListener('click',e=>{const del=e.target.closest('[data-delete-note]');if(del){e.stopPropagation();const n=notes.find(x=>x.id===del.dataset.deleteNote);if(n&&confirm(`确定删除笔记「${n.title}」吗？`)){notes=notes.filter(x=>x.id!==n.id);persist();renderNotes();toast('笔记已删除')}return}const edit=e.target.closest('[data-edit-note]');if(edit){e.stopPropagation();const n=notes.find(x=>x.id===edit.dataset.editNote);if(n)openNoteEditor(n);return}const card=e.target.closest('[data-note]');if(card){const item=notes.find(n=>n.id===card.dataset.note);if(item)openDetail('note',item)}});$('noteGrid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-note]')){e.preventDefault();const n=notes.find(x=>x.id===e.target.dataset.note);if(n)openDetail('note',n)}});
  $('newNote').onclick=()=>openNoteEditor();$('newTask').onclick=openTaskEditor;$('importNotes').onclick=()=>$('fileInput').click();$('settingsOpen').onclick=()=>{$('settingLanguage').value=settings.language;$('settingFont').value=settings.font;$('settingStorage').value=settings.storage;$('settingsBackdrop').classList.add('open')};$('saveSettings').onclick=()=>{settings={language:$('settingLanguage').value,font:$('settingFont').value,storage:$('settingStorage').value};localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));document.documentElement.lang='zh-CN';applyFont();close('settingsBackdrop');toast('设置已保存')};document.addEventListener('click',e=>{if(e.target.closest('[data-close="detail"]'))close('detailBackdrop');if(e.target.closest('[data-close="edit"]'))close('editBackdrop');if(e.target.closest('[data-close="task"]'))close('taskBackdrop');if(e.target.closest('[data-close="settings"]'))close('settingsBackdrop');if(e.target===$('detailBackdrop'))close('detailBackdrop');if(e.target===$('editBackdrop'))close('editBackdrop');if(e.target===$('taskBackdrop'))close('taskBackdrop');if(e.target===$('settingsBackdrop'))close('settingsBackdrop')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){close('detailBackdrop');close('editBackdrop');close('taskBackdrop');close('settingsBackdrop')}});
  $('noteForm').addEventListener('submit',e=>{e.preventDefault();const id=$('editId').value,old=notes.find(n=>n.id===id),n={id:id||crypto.randomUUID(),title:$('noteTitle').value.trim(),module:$('noteModule').value,body:$('noteBody').value.trim(),tags:$('noteTags').value.split(/[,，、]/).map(x=>x.trim()).filter(Boolean),updated:Date.now()};if(old)notes=notes.map(x=>x.id===id?n:x);else notes.unshift(n);noteModule=n.module;persist();renderNotes();close('editBackdrop');toast('笔记已保存')});
  $('taskForm').addEventListener('submit',e=>{e.preventDefault();const id=$('taskEditId').value,old=tasks.find(t=>t.id===id),item={id:id||crypto.randomUUID(),title:$('taskTitle').value.trim(),course:$('taskCourse').value.trim(),due:$('taskDue').value,status:$('taskStatus').value,link:$('taskLink').value.trim(),content:$('taskContent').value.trim()};if(old)tasks=tasks.map(t=>t.id===id?item:t);else tasks.unshift(item);persist();renderTasks();close('taskBackdrop');toast('作业已保存')});
  $('exportWorkspace').onclick=()=>{const blob=new Blob([JSON.stringify({app:'知作学习空间',version:1,exportedAt:new Date().toISOString(),tasks,notes,modules},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`知作备份-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('备份已导出')};$('importWorkspace').onclick=()=>$('workspaceFile').click();$('workspaceFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text()),incomingTasks=Array.isArray(data)?data:Array.isArray(data.tasks)?data.tasks:Array.isArray(data.items)?data.items:null;if(!incomingTasks)throw Error();if(confirm(`导入将替换当前的 ${tasks.length} 项作业和 ${notes.length} 篇笔记，是否继续？`)){tasks=incomingTasks.filter(x=>x&&x.title).map(x=>({id:x.id||crypto.randomUUID(),title:String(x.title),course:String(x.course||x.subject||''),due:x.due||'',status:x.status==='done'?'done':'progress',link:x.link||'',content:String(x.content||x.notes||'')}));notes=Array.isArray(data.notes)?data.notes:[];modules=Array.isArray(data.modules)&&data.modules.length?data.modules:modules;persist();renderTasks();renderNotes();toast('学习空间备份已导入')}}catch{toast('备份文件格式不正确')}e.target.value=''});
  $('fileInput').addEventListener('change',async e=>{const files=[...e.target.files];let added=0;for(const f of files){try{const text=await f.text(),ext=f.name.split('.').pop().toLowerCase();if(ext==='json'){const data=JSON.parse(text),arr=Array.isArray(data)?data:Array.isArray(data.notes)?data.notes:[data];for(const v of arr){const module=String(v.module||(noteModule==='全部笔记'?modules[0]:noteModule));if(!modules.includes(module))modules.push(module);notes.unshift({id:crypto.randomUUID(),title:String(v.title||v.name||f.name),module,body:String(v.body??v.content??v.text??''),tags:Array.isArray(v.tags)?v.tags:[],updated:Date.now()});added++}}else{const m=text.match(/^#\s+(.+)\s*\n/),module=noteModule==='全部笔记'?modules[0]:noteModule;notes.unshift({id:crypto.randomUUID(),title:m?m[1].trim():f.name.replace(/\.[^.]+$/,''),module,body:m?text.slice(m[0].length).trim():text,tags:[],updated:Date.now()});added++}}catch{toast(`无法读取 ${f.name}`)}}if(added){persist();renderNotes();toast(`已导入 ${added} 篇笔记`)}e.target.value=''});
  load();loadSettings();renderTasks();renderNotes();
})();
</script>
</body>
</html>
